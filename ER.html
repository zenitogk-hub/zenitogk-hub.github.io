        // Функция для перемешивания массива
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Функция для нормализации имени файла изображения
        function normalizeImageName(imageName) {
            if (!imageName) return null;
            // Убираем расширение и приводим к нижнему регистру
            const nameWithoutExt = imageName.replace(/\.[^/.]+$/, "");
            return nameWithoutExt.toLowerCase();
        }

        // Функция для генерации HTML для одной карточки
        function createCard(questionData, cardIndex) {
            const answers = [...questionData.answers];
            const shuffledAnswers = shuffleArray(answers);
            
            // Находим индекс правильного ответа в перемешанном массиве
            const correctAnswerIndex = shuffledAnswers.indexOf(questionData.answers[0]);
            
            let imageHtml = '';
            if (questionData.image && questionData.image.toLowerCase() !== 'без картинки') {
                const normalizedImage = normalizeImageName(questionData.image);
                imageHtml = `
                    <div class="image-container">
                        <img src="PIC/${normalizedImage}.jpg" alt="Изображение вопроса" onerror="this.onerror=null;this.src='PIC/${normalizedImage}.jpg';">
                    </div>
                `;
            } else {
                imageHtml = `
                    <div class="image-container">
                        <div class="no-image">БЕЗ КАРТИНКИ</div>
                    </div>
                `;
            }

            let answersHtml = '';
            shuffledAnswers.forEach((answer, index) => {
                answersHtml += `<div class="answer" data-card="${cardIndex}" data-index="${index}" data-correct="${index === correctAnswerIndex}">${answer}</div>`;
            });

            return `
                <div class="card">
                    ${imageHtml}
                    <div class="question">
                        ${questionData.id} ${questionData.source}<br>
                        ${questionData.question}
                    </div>
                    <div class="answers">
                        ${answersHtml}
                    </div>
                </div>
            `;
        }

        // Функция для создания трех колонок
        function createColumns() {
            const container = document.getElementById('container');
            container.innerHTML = '';
            
            // Создаем три колонки
            for (let i = 0; i < 3; i++) {
                const column = document.createElement('div');
                column.className = 'column';
                column.id = `column-${i}`;
                container.appendChild(column);
            }
            
            // Перемешиваем вопросы
            const shuffledQuestions = shuffleArray([...questionsData]);
            
            // Распределяем вопросы по колонкам
            shuffledQuestions.forEach((question, index) => {
                const columnIndex = index % 3;
                const column = document.getElementById(`column-${columnIndex}`);
                const cardHtml = createCard(question, index);
                column.innerHTML += cardHtml;
            });
            
            // Добавляем обработчики событий
            addEventListeners();
        }

        // Функция для добавления обработчиков событий
        function addEventListeners() {
            const answers = document.querySelectorAll('.answer');
            answers.forEach(answer => {
                answer.addEventListener('click', function() {
                    const cardIndex = this.getAttribute('data-card');
                    const isCorrect = this.getAttribute('data-correct') === 'true';
                    const allAnswersInCard = document.querySelectorAll(`.answer[data-card="${cardIndex}"]`);
                    
                    // Убираем обработчики событий со всех ответов в карточке
                    allAnswersInCard.forEach(ans => {
                        ans.style.pointerEvents = 'none';
                    });
                    
                    if (isCorrect) {
                        this.classList.add('correct');
                    } else {
                        this.classList.add('incorrect');
                        // Находим правильный ответ и подсвечиваем его
                        allAnswersInCard.forEach(ans => {
                            if (ans.getAttribute('data-correct') === 'true') {
                                ans.classList.add('correct');
                            }
                        });
                    }
                });
            });
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            createColumns();
        });
    </script>
